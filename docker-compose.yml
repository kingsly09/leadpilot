# Optional local infra. Alternative: use free Supabase (Postgres+pgvector) and Upstash (Redis).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    volumes: [n8ndata:/home/node/.n8n]
volumes:
  pgdata:
  n8ndata:
